version: "3.8"

services:
  starlink-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    restart: unless-stopped

    networks:
      - starlink-net

    # safer healthcheck (no curl dependency)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  starlink-net:
    external: true
